<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Video Downloader</title>

<style>
:root {
  --bg: #0f1117;
  --card: #161a22;
  --text: #e6e6eb;
  --muted: #9aa0aa;
  --accent: #6ae3ff;
  --accent-hover: #4fd1e8;
  --border: #262b36;
  --warning: #ffb86c;
}

* { box-sizing: border-box; }

body {
  font-family: Inter, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 0;
  text-align: center;
}

header {
  padding: 24px;
  font-size: 22px;
  font-weight: 600;
}

.notice {
  background: rgba(255,184,108,0.08);
  border: 1px solid var(--warning);
  color: var(--warning);
  padding: 14px;
  margin: 20px auto;
  width: 90%;
  max-width: 620px;
  border-radius: 10px;
  font-size: 14px;
}

.notice a {
  color: var(--accent);
  font-weight: 600;
  text-decoration: none;
}

.notice a:hover {
  text-decoration: underline;
}

.container { margin-top: 20px; }

.tool-box {
  background: var(--card);
  padding: 28px;
  border-radius: 14px;
  width: 90%;
  max-width: 620px;
  margin: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  border: 1px solid var(--border);
}

input[type="text"] {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #0c0f14;
  color: var(--text);
  font-size: 15px;
  outline: none;
}

input::placeholder { color: var(--muted); }

button {
  padding: 12px 20px;
  background: var(--accent);
  color: #001018;
  border: none;
  font-size: 15px;
  cursor: pointer;
  border-radius: 10px;
  margin-top: 12px;
  font-weight: 600;
  transition: transform .1s ease, background .2s ease;
}

button:hover {
  background: var(--accent-hover);
  transform: translateY(-1px);
}

#result {
  margin-top: 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

#embed {
  width: 100%;
  max-width: 560px;
  height: 315px;
  border-radius: 14px;
  border: 1px solid var(--border);
}

#status {
  color: var(--muted);
  font-size: 14px;
}

progress {
  width: 80%;
  max-width: 420px;
  height: 10px;
  border-radius: 999px;
  overflow: hidden;
}

.loader {
  display: none;
}

footer {
  margin-top: 50px;
  font-size: 13px;
  color: var(--muted);
}
</style>
</head>
